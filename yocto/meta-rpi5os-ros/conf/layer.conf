# meta-rpi5os-ros: ROS 2 (Jazzy, via meta-ros) on top of rpi5os-image.
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "rpi5os-ros"
BBFILE_PATTERN_rpi5os-ros = "^${LAYERDIR}/"
BBFILE_PRIORITY_rpi5os-ros = "11"

LAYERDEPENDS_rpi5os-ros = "core rpi5os ros-common-layer ros2-layer ros2-jazzy-layer multimedia-layer meta-python"
LAYERSERIES_COMPAT_rpi5os-ros = "wrynose"

# The ROS 2 sources (ros2/ in the repo). build.sh points this at its ext4 copy.
RPI5OS_ROS2_SRC_DEFAULT := "${LAYERDIR}/../../ros2"
RPI5OS_ROS2_SRC ?= "${RPI5OS_ROS2_SRC_DEFAULT}"

# Camera: libcamera from meta-multimedia, which meta-raspberrypi extends with
# the Pi 5 (PiSP) pipeline. meta-ros jazzy brings its own libcamera 0.7.2 for
# camera_ros; the image must have one, the one rpicam-apps is built for.
PREFERRED_VERSION_libcamera = "0.6.0"

# OpenCV for rpi5os-vision: imgproc/imgcodecs and the Python module. The recipe
# appends gapi/gstreamer/gphoto2 for the target, so :remove, not an assignment.
PACKAGECONFIG:remove:pn-opencv = "eigen tiff v4l libv4l samples tbb gtk gapi gstreamer gphoto2 libav"

# vision/ in the repo (rpi5os_vision + models/current). build.sh points this at its ext4 copy.
RPI5OS_VISION_SRC_DEFAULT := "${LAYERDIR}/../../vision"
RPI5OS_VISION_SRC ?= "${RPI5OS_VISION_SRC_DEFAULT}"
