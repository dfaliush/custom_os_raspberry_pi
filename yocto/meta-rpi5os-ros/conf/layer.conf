# meta-rpi5os-ros: ROS 2 (Jazzy, via meta-ros) on top of rpi5os-image.
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "rpi5os-ros"
BBFILE_PATTERN_rpi5os-ros = "^${LAYERDIR}/"
BBFILE_PRIORITY_rpi5os-ros = "11"

LAYERDEPENDS_rpi5os-ros = "core rpi5os ros-common-layer ros2-layer ros2-jazzy-layer"
LAYERSERIES_COMPAT_rpi5os-ros = "wrynose"

# The ROS 2 sources (ros2/ in the repo). build.sh points this at its ext4 copy.
RPI5OS_ROS2_SRC_DEFAULT := "${LAYERDIR}/../../ros2"
RPI5OS_ROS2_SRC ?= "${RPI5OS_ROS2_SRC_DEFAULT}"
