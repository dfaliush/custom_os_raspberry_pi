# rpi5os: Raspberry Pi 5 + Wi-Fi + SSH, the Yocto counterpart of buildroot/.
# Version source for os-release, image and release names.
DISTRO = "rpi5os"
DISTRO_NAME = "rpi5os"
DISTRO_VERSION = "1.0.0"
DISTRO_CODENAME = "yocto"

INIT_MANAGER = "systemd"
DISTRO_FEATURES = "acl ipv4 ipv6 wifi xattr"
# Nothing here needs these, and backfilling them pulls in large dependency trees.
DISTRO_FEATURES_OPTED_OUT += "pulseaudio gobject-introspection-data"

# defaultsetup.conf already brings uninative, security flags and no static libs.
TCLIBC = "glibc"

# linux-firmware-rpidistro (CYW43455 Wi-Fi firmware) is under this license flag.
LICENSE_FLAGS_ACCEPTED += "synaptics-killswitch"

hostname:pn-base-files = "rpi5os-yocto"
