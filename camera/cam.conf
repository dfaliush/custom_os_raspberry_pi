# Налаштування cam. Формат bash: KEY=value, без пробілів навколо "=".
# Після зміни просто запусти режим ще раз (cam stop, потім cam stream).

# Режим сенсора IMX219 для стріму й відео.
#   1640:1232 — уся матриця з біннінгом 2x2: повний кут огляду, до 81 fps.
#   1920:1080 — центральна вирізка (здається, що камера «наближує»).
SENSOR_MODE=1640:1232

# cam stream: MJPEG у браузер, http://<pi>.local:STREAM_PORT/
STREAM_PORT=8000
STREAM_WIDTH=1280
STREAM_HEIGHT=960
STREAM_FPS=30
STREAM_QUALITY=60          # JPEG 1..100; вище — краще, але більше трафіку

# cam photo: одне фото повної роздільності
PHOTO_WIDTH=3280
PHOTO_HEIGHT=2464
PHOTO_QUALITY=93
PHOTO_WAIT_MS=1000         # час на автоекспозицію перед знімком
PHOTO_DIR="$HOME/camera/photos"

# cam video: H.264 у .mp4
VIDEO_WIDTH=1640
VIDEO_HEIGHT=1232
VIDEO_FPS=30
VIDEO_BITRATE=10000000     # біт/с
VIDEO_DIR="$HOME/camera/videos"
