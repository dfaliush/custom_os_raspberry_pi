[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rpi5os-vision"
version = "1.2.0"
description = "rpi5os: YOLO (NCNN) object detection from the Raspberry Pi camera"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy", "pyyaml"]

[project.optional-dependencies]
pc = ["ncnn==1.0.20260526", "opencv-python-headless"]

[project.scripts]
rpi5os-detect = "rpi5os_vision.run:main"

[tool.setuptools]
packages = ["rpi5os_vision"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
